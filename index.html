<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script>
      // Suppress Vite HMR WebSocket connection errors in iframe environment
      (function() {
        const isWsError = (msg) => {
          if (!msg) return false;
          const str = typeof msg === 'string' ? msg : (msg.message || msg.reason?.message || String(msg));
          return str.includes('WebSocket') || str.includes('@vite/client') || str.includes('connection lost');
        };

        window.addEventListener('error', function (event) {
          if (event && (isWsError(event.message) || isWsError(event.error) || (event.target && event.target.constructor && event.target.constructor.name === 'WebSocket'))) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function (event) {
          if (event && isWsError(event.reason)) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        const origOnError = window.onerror;
        window.onerror = function (msg, url, line, col, error) {
          if (isWsError(msg) || isWsError(error) || (url && url.includes('@vite/client'))) {
            return true;
          }
          if (origOnError) return origOnError.apply(this, arguments);
        };
      })();
    </script>
    <script>
      // Apply persisted theme before initial paint to prevent theme flash
      try {
        const savedTheme = localStorage.getItem('an_erp_theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }
      } catch (e) {}
    </script>
    <title>An Printing ERP — Bag Printing Management System</title>
    <meta name="description" content="Comprehensive business management system for An Printing (Algeria) — specializing in plastic, carton, and TNT bag printing, inventory tracking, production, orders, debts, and financial reports." />
